<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Introduction to Artificial Intelligence Using Claude: From Fundamentals to Practical Applications — Cedars Abroad Executive Certificate">
<title>Introduction to AI Using Claude — Executive Certificate — Cedars Abroad</title>
</head>
<body>
<style>
  :root{
    color-scheme: light;
    --page:#f6f5f3;
    --surface:#ffffff;
    --surface-2:#efece7;
    --rail:#181410;
    --rail-ink:#e8ded4;
    --rail-ink-dim:#a89a8a;
    --ink:#181410;
    --ink-2:#4c463f;
    --ink-muted:#8a8175;
    --border:rgba(24,20,16,0.10);
    --grid:#e6e1d9;
    --accent:#c15f3c;
    --accent-wash:rgba(193,95,60,0.10);
    --accent-ink:#a1492b;
    --good:#0ca30c;
    --good-ink:#006300;
    --bad:#d03b3b;
    --amber:#b8790a;
    --m1:#4a3aa7; --m2:#c15f3c; --m3:#1baf7a; --m4:#c23f7b; --m5:#1c7fc0; --m6:#8a6d0a;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --page:#131110; --surface:#1c1917; --surface-2:#242019; --rail:#0e0c0a;
      --rail-ink:#ece5db; --rail-ink-dim:#948b7e; --ink:#f3efe9; --ink-2:#c4bcaf; --ink-muted:#8a8175;
      --border:rgba(255,255,255,0.10); --grid:#2c2721; --accent:#e08059; --accent-wash:rgba(224,128,89,0.16);
      --accent-ink:#f0a685; --good:#3fc23f; --good-ink:#5fd65f; --bad:#e66767; --amber:#e0ab3e;
      --m1:#9085e9; --m2:#e08059; --m3:#2fd99a; --m4:#e878ab; --m5:#5aa9e6; --m6:#e0ab3e;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#131110; --surface:#1c1917; --surface-2:#242019; --rail:#0e0c0a;
    --rail-ink:#ece5db; --rail-ink-dim:#948b7e; --ink:#f3efe9; --ink-2:#c4bcaf; --ink-muted:#8a8175;
    --border:rgba(255,255,255,0.10); --grid:#2c2721; --accent:#e08059; --accent-wash:rgba(224,128,89,0.16);
    --accent-ink:#f0a685; --good:#3fc23f; --good-ink:#5fd65f; --bad:#e66767; --amber:#e0ab3e;
    --m1:#9085e9; --m2:#e08059; --m3:#2fd99a; --m4:#e878ab; --m5:#5aa9e6; --m6:#e0ab3e;
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --page:#f6f5f3; --surface:#ffffff; --surface-2:#efece7; --rail:#181410;
    --rail-ink:#e8ded4; --rail-ink-dim:#a89a8a; --ink:#181410; --ink-2:#4c463f; --ink-muted:#8a8175;
    --border:rgba(24,20,16,0.10); --grid:#e6e1d9; --accent:#c15f3c; --accent-wash:rgba(193,95,60,0.10);
    --accent-ink:#a1492b; --good:#0ca30c; --good-ink:#006300; --bad:#d03b3b; --amber:#b8790a;
    --m1:#4a3aa7; --m2:#c15f3c; --m3:#1baf7a; --m4:#c23f7b; --m5:#1c7fc0; --m6:#8a6d0a;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  .app{display:flex;min-height:100vh;width:100%;}

  .rail{
    width:250px;flex:none;background:var(--rail);color:var(--rail-ink);
    display:flex;flex-direction:column;padding:22px 14px;gap:4px;
    position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  }
  .rail-brand{padding:4px 10px 18px;}
  .rail-brand .k{font-family:var(--serif);font-size:18px;line-height:1.2;color:#fff;letter-spacing:.2px;}
  .rail-brand .s{display:block;margin-top:5px;font-size:10.5px;color:var(--rail-ink-dim);text-transform:uppercase;letter-spacing:.08em;}
  .rail-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--rail-ink-dim);padding:14px 10px 6px;}
  .rail-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;
    border:1px solid transparent;background:transparent;color:var(--rail-ink);text-align:left;font-family:var(--sans);
    font-size:13.5px;width:100%;
  }
  .rail-item:hover{background:rgba(255,255,255,0.06);}
  .rail-item.active{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.10);}
  .rail-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dot,#888);}
  .rail-item .lbl{flex:1;}
  .rail-item .cnt{font-size:10px;color:var(--rail-ink-dim);font-variant-numeric:tabular-nums;}
  .rail-item.active .cnt{color:var(--rail-ink);}
  .rail-foot{margin-top:auto;padding:10px;font-size:11px;color:var(--rail-ink-dim);line-height:1.5;border-top:1px solid rgba(255,255,255,0.08);padding-top:14px;}
  .rail-cta{display:block;margin-top:12px;width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);text-align:center;text-decoration:none;}
  .rail-cta:hover{opacity:.9;}

  .stage{flex:1;min-width:0;padding:34px 40px 64px;max-width:1180px;}
  .panel{display:none;animation:fade .22s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);margin:0 0 8px;}
  h1.page-title{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.2;margin:0 0 10px;text-wrap:balance;}
  h2.sub-title{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 4px;}
  p.page-sub{font-size:15px;color:var(--ink-2);max-width:68ch;line-height:1.55;margin:0 0 28px;}
  p.section-note{font-size:13px;color:var(--ink-muted);margin:0 0 18px;max-width:68ch;line-height:1.5;}

  .badge-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px 3px 8px;border-radius:100px;border:1px solid var(--border);color:var(--ink-2);background:var(--surface);}
  .badge-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--dot,var(--accent));}
  .badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}

  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{opacity:.92;color:#fff;}
  .btn.small{padding:6px 12px;font-size:12px;}

  /* ---- Overview hero ---- */
  .hero-card{background:linear-gradient(135deg,var(--accent-wash),transparent 60%);border:1px solid var(--border);border-radius:14px;padding:26px 30px;margin-bottom:26px;}
  .stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .stat-tile .st-num{font-size:22px;font-weight:700;font-family:var(--serif);}
  .stat-tile .st-lbl{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .card h3{font-size:14.5px;margin:0 0 8px;}
  .card ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.65;}
  .card p{font-size:13px;color:var(--ink-2);line-height:1.6;margin:0;}

  .audience-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
  .audience-chip{background:var(--surface-2);border-radius:100px;padding:6px 14px;font-size:12.5px;color:var(--ink-2);}

  /* ---- Curriculum modules ---- */
  .module-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--dot,var(--accent));border-radius:12px;padding:20px 22px;margin-bottom:16px;}
  .module-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
  .module-name{font-size:16.5px;font-weight:700;margin:0;}
  .module-dur{font-size:12px;color:var(--ink-muted);background:var(--surface-2);padding:4px 10px;border-radius:100px;white-space:nowrap;}
  .module-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px;}
  .module-cols h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);margin:0 0 6px;}
  .module-cols ul{margin:0;padding-left:16px;font-size:13px;color:var(--ink-2);line-height:1.6;}
  .module-topics{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;line-height:1.6;margin-top:12px;}
  @media (max-width:820px){ .module-cols{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} .stat-strip{grid-template-columns:1fr 1fr;} }

  /* ---- Slide deck ---- */
  .deck-shell{max-width:1000px;margin:0 auto;}
  .deck-viewport{position:relative;width:100%;aspect-ratio:1280/720;border-radius:10px;overflow:hidden;background:#171310;box-shadow:0 16px 50px rgba(0,0,0,0.25);}
  .deck-viewport:fullscreen{width:100vw;height:100vh;border-radius:0;}
  .deck-stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left;}
  .dslide{position:absolute;inset:0;display:none;font-family:var(--sans);background:#fff;}
  .dslide.active{display:block;}
  .dslide .d-accent{position:absolute;top:0;left:0;right:0;height:8px;background:var(--accent);}
  .dslide .d-kicker{position:absolute;left:60px;top:44px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent-ink);text-transform:uppercase;}
  .dslide .d-heading{position:absolute;left:60px;top:80px;right:60px;font-family:var(--serif);font-weight:400;font-size:30px;color:#181410;line-height:1.2;}
  .dslide .d-heading.no-kicker{top:44px;}
  .dslide .d-bullets{position:absolute;left:68px;top:160px;right:70px;bottom:118px;margin:0;padding:0;list-style:none;overflow:auto;}
  .dslide .d-bullets li{position:relative;padding-left:24px;margin-bottom:13px;font-size:17px;line-height:1.5;color:#4c463f;}
  .dslide .d-bullets li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .dslide .d-bullets li b{color:#181410;font-weight:700;}
  .dslide .d-foot{position:absolute;left:60px;right:60px;bottom:56px;top:auto;display:flex;gap:22px;border-top:1px solid #e6e1d9;padding-top:10px;}
  .dslide .d-foot .fbox{flex:1;font-size:11px;line-height:1.4;color:#8a8175;}
  .dslide .d-foot .fbox b{display:block;color:#4c463f;font-weight:700;margin-bottom:2px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
  .dslide .d-footleft{position:absolute;left:60px;bottom:20px;font-size:11px;color:#8a8175;font-weight:600;}
  .dslide .d-pageno{position:absolute;right:60px;bottom:20px;font-size:11px;color:#8a8175;font-variant-numeric:tabular-nums;}
  .dslide.d-title,.dslide.d-section{color:#fff;background:linear-gradient(135deg,#181410,#3a2a20);}
  .dslide .d-t-eyebrow{position:absolute;left:0;right:0;top:225px;text-align:center;font-size:14px;font-weight:700;letter-spacing:.14em;color:#f0c4ab;text-transform:uppercase;}
  .dslide .d-t-title{position:absolute;left:80px;right:80px;top:266px;text-align:center;font-family:var(--serif);font-weight:400;font-size:48px;line-height:1.15;}
  .dslide .d-t-subtitle{position:absolute;left:80px;right:80px;top:388px;text-align:center;font-size:19px;color:#e8ded4;}
  .dslide .d-t-footer{position:absolute;left:120px;right:120px;top:520px;text-align:center;font-size:13px;color:#c4bcaf;}
  .dslide .d-sec-eyebrow{position:absolute;left:0;right:0;top:298px;text-align:center;font-size:15px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,0.75);text-transform:uppercase;}
  .dslide .d-sec-title{position:absolute;left:80px;right:80px;top:338px;text-align:center;font-family:var(--serif);font-weight:400;font-size:42px;line-height:1.2;}
  .deck-controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .deck-count{font-size:12.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums;min-width:70px;text-align:center;}
  .deck-jump{width:52px;border:1px solid var(--border);border-radius:8px;padding:8px 6px;font-size:13px;text-align:center;background:var(--surface);color:var(--ink);}
  .deck-sep{width:1px;height:22px;background:var(--border);margin:0 2px;}
  .deck-toc{max-width:1000px;margin:22px auto 0;display:flex;flex-wrap:wrap;gap:6px;}
  .deck-toc button{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font-size:11px;padding:5px 9px;border-radius:6px;cursor:pointer;font-family:var(--sans);}
  .deck-toc button.cur{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-wash);}
  .notes-toggle-wrap{max-width:1000px;margin:14px auto 0;}
  .notes-panel{display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-top:10px;font-size:13px;line-height:1.6;color:var(--ink-2);}
  .notes-panel.show{display:block;}
  .notes-panel .nrow{margin-bottom:8px;}
  .notes-panel .nrow:last-child{margin-bottom:0;}
  .notes-panel b{color:var(--ink);}

  /* ---- Filter chips / search ---- */
  .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .filter-chip{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:100px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:var(--sans);}
  .filter-chip:hover{border-color:var(--accent);}
  .filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .search-box{width:100%;max-width:340px;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;background:var(--surface);color:var(--ink);font-family:var(--sans);margin-bottom:16px;}

  /* ---- Prompt cards ---- */
  .prompt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .prompt-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .prompt-cat{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);font-weight:700;margin-bottom:6px;}
  .prompt-purpose{font-size:14px;font-weight:700;margin-bottom:8px;}
  .prompt-text{font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:10px 12px;color:var(--ink-2);line-height:1.55;margin-bottom:8px;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;}
  .prompt-meta{font-size:12px;color:var(--ink-2);line-height:1.55;margin-bottom:6px;}
  .prompt-meta b{color:var(--ink);}
  .prompt-tip{font-size:11.5px;color:var(--ink-muted);border-top:1px solid var(--border);padding-top:8px;margin-top:8px;}
  .copy-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font-size:11px;padding:4px 9px;border-radius:6px;cursor:pointer;float:right;font-family:var(--sans);}
  .copy-btn:hover{border-color:var(--accent);color:var(--accent-ink);}
  @media (max-width:820px){ .prompt-grid{grid-template-columns:1fr;} }

  /* ---- Profession cards ---- */
  .prof-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  .prof-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .prof-head{padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .prof-head:hover{background:var(--surface-2);}
  .prof-head .pname{font-size:15px;font-weight:700;}
  .prof-head .parrow{color:var(--ink-muted);font-size:13px;transition:transform .15s ease;}
  .prof-card.open .parrow{transform:rotate(90deg);}
  .prof-body{display:none;padding:0 20px 20px;}
  .prof-card.open .prof-body{display:block;}
  .prof-sec{margin-bottom:12px;}
  .prof-sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);margin:0 0 5px;}
  .prof-sec p, .prof-sec ul{font-size:13px;color:var(--ink-2);line-height:1.6;margin:0;padding-left:0;}
  .prof-sec ul{padding-left:16px;}
  .prof-sec .pex{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;}

  /* ---- Workshop accordion ---- */
  .domain-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;}
  .domain-head{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .domain-head:hover{background:var(--surface-2);}
  .domain-head .dname{font-size:14.5px;font-weight:700;}
  .domain-head .dcount{font-size:11.5px;color:var(--ink-muted);}
  .domain-body{display:none;padding:4px 18px 16px;}
  .domain-card.open .domain-body{display:block;}
  .ex-list{margin:0;padding-left:0;list-style:none;counter-reset:ex;}
  .ex-list li{counter-increment:ex;position:relative;padding:8px 0 8px 30px;font-size:13px;color:var(--ink-2);line-height:1.5;border-top:1px solid var(--border);}
  .ex-list li:first-child{border-top:none;}
  .ex-list li::before{content:counter(ex);position:absolute;left:0;top:8px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--ink-muted);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}

  /* ---- Quiz ---- */
  .quiz-shell{max-width:760px;}
  .quiz-progress{font-size:12.5px;color:var(--ink-muted);margin-bottom:14px;}
  .quiz-q{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:14px;}
  .quiz-q .qn{font-size:11px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
  .quiz-q .qtext{font-size:14.5px;font-weight:600;margin-bottom:12px;}
  .quiz-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:13.5px;}
  .quiz-opt:hover{border-color:var(--accent);}
  .quiz-opt.selected{border-color:var(--accent);background:var(--accent-wash);}
  .quiz-opt.correct{border-color:var(--good);background:rgba(12,163,12,0.10);}
  .quiz-opt.incorrect{border-color:var(--bad);background:rgba(208,59,59,0.10);}
  .quiz-explain{display:none;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:8px;line-height:1.55;}
  .quiz-explain.show{display:block;}
  .quiz-score{background:var(--accent-wash);border:1px solid var(--border);border-radius:12px;padding:24px 26px;text-align:center;margin-bottom:20px;}
  .quiz-score .qs-num{font-size:38px;font-weight:700;font-family:var(--serif);}
  .quiz-score .qs-lbl{font-size:13px;color:var(--ink-2);margin-top:4px;}

  .rubric-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  .rubric-table th,.rubric-table td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top;}
  .rubric-table th{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);}

  ::selection{background:var(--accent-wash);}

  @media (max-width: 900px){
    .app{flex-direction:column;}
    .rail{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:14px;align-items:center;}
    .rail-brand{padding:0 10px 0 0;}
    .rail-group-label{display:none;}
    .rail-item{width:auto;}
    .rail-foot{display:none;}
    .stage{padding:24px 18px 48px;}
  }
</style>

<div class="app">
  <nav class="rail" id="rail">

{y:"title",t:"Introduction to Artificial Intelligence Using Claude",sub:"From Fundamentals to Practical Applications — Executive Certificate",foot:"Cedars Abroad · 12-Hour Executive Program",n:"Welcome participants, introduce yourself, and set expectations: this is hands-on, not theoretical — everyone will be using Claude live throughout the day.",v:"Full-bleed title slide with Cedars Abroad wordmark.",e:"—",q:"Ask each participant to share one task they hope AI can take off their plate."},

{y:"content",m:"m1",t:"AI, Machine Learning, Deep Learning — How They Relate",b:["<b>Artificial Intelligence</b>: the broad goal — machines performing intelligent tasks","<b>Machine Learning (ML)</b>: a subset of AI where the system learns patterns from data instead of following hand-written rules","<b>Deep Learning</b>: a subset of ML using layered 'neural networks' to learn very complex patterns","<b>Generative AI</b>: a subset of deep learning that creates new content — text, images, audio, code"],n:"Draw this as nested circles live if possible: AI > ML > Deep Learning > Generative AI. This single slide resolves most of the terminology confusion in the room.",v:"Nested circle diagram (AI containing ML containing Deep Learning containing Generative AI).",e:"Claude is generative AI, built with deep learning, which is a form of machine learning, which is a field of AI.",q:"Where would you place a Netflix recommendation engine on this diagram?"},

{y:"content",m:"m1",t:"From Narrow AI to Generative AI",b:["<b>Narrow AI</b>: built for one specific task (chess, spam filtering, fraud detection)","<b>General-purpose generative AI</b>: one model, trained broadly, can write, summarize, code, and analyze","This shift — from single-purpose tools to general-purpose assistants — is what makes Claude usable across every profession in this room","We are still far from 'Artificial General Intelligence' (human-level intelligence across all domains) — today's tools are powerful but narrow in a new, broader way"],n:"Correct a common misconception here: today's AI is not 'thinking' the way a person does, even though it can hold a fluent conversation.",v:"Two-column comparison: Narrow AI examples vs. Generative AI capabilities.",e:"A chess engine only plays chess. Claude can draft a contract, then explain a spreadsheet, then write a lesson plan — all in one conversation.",q:"Which of today's tasks would you have assumed needed a human a year ago?"},

{y:"content",m:"m1",t:"AI Ethics and Responsible AI",b:["Fairness: avoiding or catching biased outputs across race, gender, age, and other characteristics","Transparency: disclosing when content was AI-assisted, especially in regulated or sensitive contexts","Accountability: a human remains responsible for any AI-assisted decision or output","Privacy: not feeding confidential or personal data into tools without organizational approval"],n:"Connect this directly to Module 2's privacy content — this is the conceptual foundation, Module 2 is the practical application.",v:"Four-pillar diagram: Fairness, Transparency, Accountability, Privacy.",e:"A hiring manager using AI to screen resumes must check for and correct demographic bias in the results.",q:"What's one AI use in your organization that would raise an ethics flag?"},

{y:"content",m:"m1",t:"AI Governance: Rules Organizations Are Adopting",b:["Written AI usage policies: what tools are approved, what data may or may not be entered","Human-in-the-loop requirements for high-stakes decisions (hiring, medical, legal, financial)","Regulatory context: the EU AI Act, sector-specific rules, and emerging regional regulation","Internal review or approval processes before AI-generated content goes external"],n:"If the audience includes decision-makers, mention that a one-page AI usage policy is one of the highest-leverage first steps an organization can take.",v:"Simple governance checklist graphic.",e:"A hospital may require a clinician to review and sign off on any AI-drafted patient note before it enters the record.",q:"Does your organization currently have a written AI usage policy?"},

{y:"content",m:"m1",t:"The Future of AI at Work",b:["AI as a 'co-worker' embedded in daily tools rather than a novelty to visit occasionally","Growing demand for AI literacy as a baseline professional skill, similar to spreadsheets in the 1990s","Jobs shift more than they disappear outright — tasks change faster than roles do","The advantage goes to people and organizations who learn to direct AI well, not just use it passively"],n:"Close Module 1 on an empowering note before moving into hands-on Claude training — this sets up Module 2 as 'now let's actually do this.'",v:"—",e:"—",q:"What's one task you want to be doing with AI's help by this time next year?"},

{y:"section",m:"m2",t:"Module 2 — The Claude Platform in Practice",n:"2 hours. Goal: everyone can independently open Claude, start a Project, upload a file, and get usable output by the end of this module.",},

{y:"content",m:"m2",t:"Tour of the Claude Interface",b:["Left sidebar: your chat history and Projects","Main panel: the conversation itself, where you type prompts and read responses","Model selector: choose which Claude model is active for the conversation","Attachment icon: upload files directly into a chat or Project"],n:"Do this as a live screen-share, not slides alone — have every participant open Claude on their own device and follow along.",v:"Live screen-share of claude.ai.",e:"Open a fresh chat and point out each interface element in turn.",q:"—"},

{y:"content",m:"m2",t:"Chats vs Projects vs Artifacts",b:["<b>Chats</b>: a single conversation thread, good for one-off questions","<b>Projects</b>: a persistent workspace with its own instructions, files, and chat history — ideal for ongoing work","<b>Artifacts</b>: a side-by-side panel where Claude renders documents, code, or visuals you can view and iterate on directly","Rule of thumb: if you'll return to this task more than once, make it a Project"],n:"This distinction is the single most useful piece of interface knowledge for professional use — spend real time here.",v:"Three-panel comparison graphic.",e:"A lawyer reviewing contracts all month should have one 'Contract Review' Project, not dozens of separate chats.",q:"What's one recurring task in your job that deserves its own Project?"},

{y:"content",m:"m2",t:"Setting Up Your First Claude Project",b:["Name the Project clearly (e.g. 'Q3 Marketing Reports')","Add custom instructions describing your role, tone preferences, and standing constraints","Upload reference files the Project should always have access to","Every chat inside the Project automatically has that context — no need to repeat yourself"],n:"Live demo: create a Project together with the whole room, using an example relevant to the audience's shared profession if possible.",v:"Live demo of Project creation.",e:"A teacher's Project instructions: 'I teach 9th grade biology. Keep explanations at that reading level unless I say otherwise.'",q:"—"},

{y:"content",m:"m2",t:"Uploading Files: What Claude Can Read",b:["Documents: PDF, Word (.docx), plain text, Markdown","Spreadsheets: Excel (.xlsx) and CSV","Images: photos, screenshots, scanned pages, charts","Presentations: PowerPoint (.pptx) files"],n:"Mention practical limits: very large files or many files at once may need to be split or summarized in stages.",v:"File-type icon row.",e:"Upload a sample PDF live and ask Claude to summarize it.",q:"—"},

{y:"content",m:"m2",t:"Working with PDFs",b:["Upload the PDF directly rather than copy-pasting text, especially for scanned or formatted documents","Ask for a structured summary first, then drill into specific sections","For very long PDFs, ask Claude to work section by section rather than all at once","Always ask Claude to quote or cite the page/section it drew a claim from, then verify"],n:"Demo with a real multi-page PDF — a policy document, report, or research paper works well.",v:"Live demo uploading and querying a PDF.",e:"'Summarize this 40-page report in one page, then list the three most important recommendations with page numbers.'",q:"—"},

{y:"content",m:"m2",t:"Working with Images",b:["Claude can read text within images, describe visual content, and interpret charts or diagrams","Useful for digitizing handwritten notes, whiteboard photos, or scanned forms","Can compare two images or extract data from a photographed table","Always double-check numbers extracted from an image — OCR-style reading can misread digits"],n:"Have a participant upload a photo of a whiteboard or handwritten note if available, live.",v:"Live demo: upload an image and ask Claude to extract or describe its content.",e:"'Read the handwritten notes in this photo and turn them into a clean bulleted list.'",q:"—"},

{y:"content",m:"m2",t:"Working with Tables and Spreadsheets",b:["Upload an Excel or CSV file directly for Claude to analyze","Ask specific analytical questions rather than 'analyze this' — e.g. 'which region underperformed and by how much?'","Claude can calculate, spot trends, and draft a written summary of a spreadsheet","For anything mission-critical, re-verify key numbers in the actual spreadsheet formulas"],n:"Emphasize that Claude is strong at explaining and summarizing data, but a human should verify any number driving a real decision.",v:"Live demo analyzing a sample spreadsheet.",e:"'Which three products had the steepest revenue decline this quarter, and what's a plausible explanation from the data?'",q:"—"},

{y:"content",m:"m2",t:"Working with Long Documents",b:["Break large tasks into stages: outline → section drafts → full assembly → polish","Use a Project so context persists across multiple chats on the same document","Ask Claude to maintain a consistent structure, tone, and terminology across sections","Periodically ask for a running summary so you (and Claude) don't lose the thread"],n:"This is where Projects genuinely outperform single chats — demonstrate the difference if time allows.",v:"Workflow diagram: Outline → Draft → Assemble → Polish.",e:"Drafting a 20-page strategic plan: generate the outline first, approve it, then draft section by section.",q:"—"},

{y:"content",m:"m2",t:"Claude Best Practices",b:["Be specific: state the audience, purpose, length, and format you want","Give Claude relevant context before asking for output, not after","Review every output critically before using it — treat Claude like a capable but junior colleague","Iterate: your first prompt rarely produces your final answer, and that's expected"],n:"Frame this as the 'house rules' slide participants should photograph or screenshot.",v:"Checklist graphic.",e:"—",q:"—"},

{y:"content",m:"m2",t:"Common Beginner Mistakes",b:["Vague prompts ('write me something about marketing') instead of specific ones","Accepting the first answer without asking for revisions","Pasting confidential data without checking organizational policy first","Treating Claude's confident tone as proof of accuracy"],n:"Ask the room to admit which of these they've already done — this usually gets a laugh and breaks the ice.",v:"—",e:"Compare a vague prompt's output to a specific prompt's output, side by side, live.",q:"Which of these have you caught yourself doing?"},

{y:"content",m:"m2",t:"Privacy and Data Handling",b:["Do not paste passwords, financial account numbers, or other credentials into any AI tool","Check your organization's policy before entering client, patient, or employee personal data","Understand your plan's data-retention and training settings — consumer and enterprise plans differ","When in doubt, anonymize or redact identifying details before pasting"],n:"This slide should be delivered seriously and slowly — it's the single most consequential piece of guidance in the whole course.",v:"—",e:"Instead of pasting a real patient case, describe it with identifying details removed or replaced.",q:"What's one type of data in your job that should never go into a prompt?"},

{y:"content",m:"m2",t:"Security Considerations for Work Use",b:["Prefer your organization's licensed/enterprise account over a personal free account for work tasks","Understand who else in your organization can see shared Projects or chat history","Be cautious with browser extensions or third-party tools that claim to 'enhance' AI chat tools","Report suspicious AI-generated phishing attempts — attackers use the same tools you're learning today"],n:"If the audience is executives, this is a good moment to mention IT/security should be involved in any organization-wide AI rollout.",v:"—",e:"—",q:"—"},

{y:"content",m:"m2",t:"Current Limitations to Keep in Mind",b:["Knowledge has a training cutoff date unless live search or an uploaded document is provided","Not connected to your private company systems unless deliberately integrated","Can be confidently wrong (hallucination) — always verify high-stakes facts and figures","Long, complex multi-step tasks may need to be broken down and checked at each stage"],n:"Recap this list right before moving into prompt engineering — it directly motivates why prompt structure and verification matter so much.",v:"—",e:"—",q:"—"},

{y:"section",m:"m3",t:"Module 3 — Prompt Engineering Mastery",n:"2 hours. Goal: everyone can write, test, and iteratively improve a professional prompt for their own real work.",},

{y:"content",m:"m3",t:"Anatomy of a Great Prompt",b:["<b>Role</b>: who should Claude act as?","<b>Context</b>: what background does Claude need?","<b>Task</b>: what exactly do you want done?","<b>Format & constraints</b>: length, tone, structure, audience, what to avoid"],n:"Introduce this as the 'RCTF' framework participants can carry forward — write it on the whiteboard if in person.",v:"Four-part framework diagram.",e:"'You are a financial analyst (role). Here is our Q2 sales data (context). Identify the three biggest risks to Q3 revenue (task). Answer in under 200 words, in a bulleted list, for a non-financial audience (format).'",q:"—"},

{y:"content",m:"m3",t:"Role Prompting",b:["Assigning Claude a role focuses its tone, vocabulary, and priorities","Works best combined with a real task, not used alone as decoration","Roles can be professional (lawyer, teacher) or functional (skeptical editor, devil's advocate)","Stacking roles can help: 'as both a marketer and a data analyst...'"],n:"Demonstrate the same question asked with and without a role, live, and compare the two answers.",v:"Side-by-side before/after example.",e:"'Act as a skeptical procurement officer and list five questions you'd ask about this vendor proposal.'",q:"—"},

{y:"content",m:"m3",t:"Context Prompting",b:["More relevant background almost always improves output quality","Include audience, purpose, prior decisions, constraints, and what's already been tried","Paste in relevant documents or data rather than describing them from memory","Context can be added mid-conversation — you don't need a perfect first prompt"],n:"Emphasize: context is the highest-leverage lever most beginners underuse.",v:"—",e:"'This report is for our board, who are not technical. We already ruled out Option B due to cost. Focus on Options A and C.'",q:"—"},

{y:"content",m:"m3",t:"Chain-of-Thought Prompting (Conceptual)",b:["Asking Claude to reason through a problem step-by-step in its visible answer, before giving a final conclusion","Especially useful for multi-step analysis, math-adjacent reasoning, or decisions with tradeoffs","Simple phrase: 'walk through your reasoning step by step before giving your final answer'","Lets you catch a flawed assumption partway through, rather than only seeing a final (possibly wrong) answer"],n:"Keep this conceptual and practical — the point is asking for visible reasoning, not any hidden or special mode.",v:"Before/after: direct-answer prompt vs. step-by-step prompt.",e:"'Walk through the pros and cons of each pricing option step by step, then recommend one and explain why.'",q:"—"},

{y:"content",m:"m3",t:"Few-Shot Prompting",b:["Give Claude 2-3 examples of the input/output pattern you want before asking for a new one","Especially powerful for consistent formatting, tone-matching, or classification tasks","Examples teach the pattern faster and more reliably than a paragraph of instructions","Keep examples genuinely representative of the range of cases you'll need"],n:"Demo: classify three sample customer complaints live using two worked examples as a pattern.",v:"Example-pattern diagram: Example 1 → Example 2 → New input → Claude's output.",e:"'Here are two examples of how we tag support tickets: [example 1] [example 2]. Now tag this new ticket the same way: [new ticket]'",q:"—"},

{y:"content",m:"m3",t:"Iterative Prompting and Refinement",b:["Treat the first response as a draft, not a final answer","Refine with specific feedback: 'shorter', 'more formal', 'add a counterargument', 'cite your sources'","Ask Claude to critique its own output, then revise based on that critique","Save a prompt that finally worked — it's the seed of a reusable template"],n:"This is the single habit that most separates confident Claude users from frustrated ones — spend extra time here.",v:"Iteration loop diagram: Prompt → Draft → Feedback → Revised draft.",e:"'Good start, but make this sound more confident and cut it to 150 words.'",q:"—"},

{y:"content",m:"m3",t:"Output Formatting",b:["Specify structure explicitly: bullet points, table, numbered steps, email format, JSON","State length constraints in concrete terms (words, sentences, or paragraphs)","Ask for headers or sections when the output will be long","Request a specific tone: formal, conversational, persuasive, neutral"],n:"Show a table-formatted output live — this is often the single most-requested skill from executive audiences.",v:"Format-request examples: bullets, table, email, JSON.",e:"'Present this as a table with columns: Option, Cost, Timeline, Risk.'",q:"—"},

{y:"content",m:"m3",t:"Prompt Templates You Can Reuse",b:["A template is a prompt with blanks you fill in each time — saves time on recurring tasks","Save your best templates in a note, document, or Claude Project instructions","Build one template per recurring task type: weekly report, meeting recap, email reply","A good template still leaves room to add fresh context for the specific instance"],n:"Have participants draft their first personal template live, based on a real recurring task in their job.",v:"Template structure example with blanks marked [LIKE THIS].",e:"'Summarize this meeting transcript into: 1) Decisions made, 2) Action items with owners, 3) Open questions. Transcript: [PASTE HERE]'",q:"What's one task you do every single week that could become a template?"},

{y:"content",m:"m3",t:"Building Your Personal Prompt Library",b:["Group templates by category: writing, analysis, research, communication","Keep a running document — even a simple one — that grows over the course of the program","Note which prompts worked well and which needed heavy editing","This course's Prompt Library (100+ examples) is a starting point, not a ceiling"],n:"Point participants to the Prompt Library tab on this page as their starting collection to build from.",v:"—",e:"—",q:"—"},

{y:"content",m:"m3",t:"Prompt Engineering Best Practices",b:["Specific beats clever — clear instructions outperform elaborate wording","One task at a time is usually more reliable than five stacked into one prompt","Ask Claude to ask you clarifying questions when a task is genuinely ambiguous","Always leave room to iterate — budget two or three passes, not one"],n:"—",v:"Recap checklist.",e:"—",q:"—"},

{y:"content",m:"m3",t:"Common Prompting Mistakes",b:["Being too vague ('make this better') without saying what 'better' means","Overloading a single prompt with too many unrelated requests at once","Forgetting to give Claude the actual source material, and describing it instead","Not stating the audience, so the tone or technical level misses the mark"],n:"Ask for a show of hands on which mistake feels most familiar.",v:"—",e:"—",q:"—"},

{y:"content",m:"m3",t:"Live Practice: Refining a Weak Prompt Together",b:["Start with a deliberately vague prompt and look at the mediocre result together","Add role, then context, then format constraints — one at a time","Watch the output improve at each step","Close by asking each participant to do the same exercise on their own real task"],n:"This is a full hands-on exercise, not just a demo — budget 15-20 minutes and walk the room.",v:"Live, projected Claude session.",e:"Start: 'write about our company.' End: a fully-specified, role-and-context-rich prompt producing a genuinely usable draft.",q:"—"},

{y:"section",m:"m4",t:"Module 4 — Practical Applications Across Business Functions",n:"2 hours of live demonstrations. Goal: participants see Claude produce twenty real business deliverables and can map at least five to their own job.",},

{y:"content",m:"m4",t:"Demo: Writing a Business Report",b:["Provide the underlying data, prior reports, or notes as context","Ask for a clear structure: executive summary, findings, recommendations","Request a specific length and audience level","Iterate on tone until it matches your organization's house style"],n:"Live demo using a realistic (anonymized) business scenario relevant to the room.",v:"Live Claude session, Artifact panel showing the drafted report.",e:"'Draft a two-page quarterly performance report for our sales leadership, based on this data: [data].'",q:"—"},

{y:"content",m:"m4",t:"Demo: Summarizing a Long PDF",b:["Upload the PDF directly","Ask for a one-page executive summary plus a detailed section-by-section breakdown","Request key statistics and page references be preserved","Verify pulled numbers against the source"],n:"Reuse the PDF workflow taught in Module 2, now applied to a specific business deliverable.",v:"Live demo.",e:"'Summarize this 60-page industry report into one page for our leadership team, keeping all figures cited with page numbers.'",q:"—"},

{y:"content",m:"m4",t:"Demo: Analyzing an Excel File",b:["Upload the spreadsheet and ask targeted analytical questions","Request a written narrative interpretation, not just numbers restated","Ask for the top three insights and one recommended action","Cross-check any figure that will inform a real decision"],n:"—",v:"Live demo.",e:"'What are the three biggest cost drivers in this budget, and where would you cut first?'",q:"—"},

{y:"content",m:"m4",t:"Demo: Reviewing a Contract",b:["Upload the contract and ask Claude to flag unusual, missing, or risky clauses","Ask it to summarize obligations for each party in plain language","Request a comparison against a standard template if one exists","Always route final legal judgment to a qualified lawyer — Claude supports review, it does not replace legal counsel"],n:"State the disclaimer clearly and early: this is a triage and drafting aid, not a substitute for legal advice.",v:"Live demo with a sample (non-sensitive) contract.",e:"'Flag any clauses in this vendor agreement that are unusually one-sided or missing compared to a standard NDA.'",q:"—"},

{y:"content",m:"m4",t:"Demo: Preparing a SWOT Analysis",b:["Provide company or project background as context","Ask Claude to draft Strengths, Weaknesses, Opportunities, and Threats with brief justifications","Push back on generic points and ask for specifics tied to the actual business","Use the result as a discussion starter, not a final strategic document"],n:"—",v:"Live demo, table-formatted output.",e:"'Based on this business summary, draft a SWOT analysis with two specific, non-generic points per quadrant.'",q:"—"},

{y:"content",m:"m4",t:"Demo: Developing KPIs and a Balanced Scorecard",b:["Start from strategic objectives, not metrics — ask 'what would prove we succeeded?'","Ask Claude to propose 2-3 KPIs per Balanced Scorecard perspective: Financial, Customer, Process, Learning & Growth","Request a definition, target, and data source for each proposed KPI","Refine based on what your organization can realistically measure today"],n:"Cedars Abroad's dedicated AI-Enhanced Balanced Scorecard certificate goes far deeper into this specific workflow.",v:"Live demo, four-perspective table output.",e:"'Propose three KPIs for our Customer perspective, each with a target and a realistic data source.'",q:"—"},

{y:"content",m:"m4",t:"Demo: Drafting a Business Plan",b:["Work section by section: executive summary, market analysis, operations, financials, risks","Provide any market research or numbers you already have as context","Ask for realistic, sourced assumptions rather than invented statistics","Assemble and polish once every section has been reviewed"],n:"—",v:"Live demo, multi-section Artifact.",e:"'Draft the market analysis section of a business plan for a boutique consulting firm entering the Beirut market.'",q:"—"},

{y:"content",m:"m4",t:"Demo: Creating a Marketing Campaign",b:["Define the audience, channel, offer, and goal before asking for creative output","Ask for multiple concept variations, not just one","Request different lengths for different channels (social post vs. email vs. landing page)","Have Claude explain the reasoning behind each concept, not just the copy"],n:"—",v:"Live demo, multi-variant output.",e:"'Write three different social ad concepts for our new online course, targeting working professionals aged 30-45.'",q:"—"},

{y:"content",m:"m4",t:"Demo: Emails, Meeting Minutes, and Executive Summaries",b:["Paste in rough notes or a transcript rather than summarizing them yourself first","Ask for decisions, action items with owners, and open questions as separate sections","Match tone and formality to your organization's norms","For executive summaries: ask for the 'so what' — what should the reader do differently"],n:"—",v:"Live demo.",e:"'Turn these rough meeting notes into formal minutes with decisions, action items, and owners.'",q:"—"},

{y:"content",m:"m4",t:"Demo: Policies and Training Materials",b:["Provide the goal, audience, and any legal/compliance constraints up front","Ask for a plain-language draft, then a formal policy-language version","Request a short quiz or checklist to accompany training material","Have subject-matter experts review before anything goes live"],n:"—",v:"Live demo.",e:"'Draft a one-page remote work policy in plain language, then rewrite it in formal HR policy language.'",q:"—"},

{y:"content",m:"m4",t:"Chaining Claude Outputs Into One Deliverable",b:["Break big deliverables into stages: research → outline → draft → executive summary","Carry forward each stage's output as context for the next","Use a Project so the whole chain stays in one place","This is how a single conversation becomes a finished, polished document"],n:"Close Module 4 by showing one complete chain end-to-end, from a rough prompt to a polished Artifact.",v:"Workflow diagram: Research → Outline → Draft → Executive Summary.",e:"—",q:"Which of today's twenty demos maps most directly onto your own job?"},

{y:"section",m:"m5",t:"Module 5 — Profession-Specific Deep Dive & Hands-On Workshop",n:"3 hours. Goal: participants apply everything so far to their own profession and begin the capstone project.",},

{y:"content",m:"m5",t:"How Teachers and Professors Use Claude",b:["Drafting lesson plans, rubrics, and differentiated materials for mixed-ability classrooms","Generating quiz and exam questions at a specified difficulty level","Explaining a concept multiple ways when one explanation isn't landing","Getting feedback on syllabus design and course structure"],n:"Full profession detail is in the Profession Playbooks tab — this slide is a preview to spark the room's thinking.",v:"—",e:"'Create a rubric for a 10th-grade persuasive essay, with four criteria and four performance levels each.'",q:"—"},

{y:"content",m:"m5",t:"How Students and Researchers Use Claude",b:["Study aid: explaining difficult concepts, generating practice questions, checking understanding","Literature review support: summarizing papers and identifying themes across sources (always verify citations)","Structuring and outlining papers or theses before writing","Getting critical feedback on a draft before submitting it"],n:"Flag academic integrity explicitly — always follow institutional policy on AI use in coursework.",v:"—",e:"'Summarize the methodology and key findings of this paper in plain language.'",q:"—"},

{y:"content",m:"m5",t:"How Doctors and Clinicians Use Claude",b:["Drafting patient education materials in plain language","Summarizing clinical literature to stay current","Structuring case documentation and referral letters","Never for diagnosis or treatment decisions without full clinical judgment and record review — Claude is a drafting and research aid only"],n:"State the clinical disclaimer explicitly and firmly — this is a non-negotiable limitation to communicate clearly.",v:"—",e:"'Rewrite this discharge instruction in plain language a patient with no medical background can follow.'",q:"—"},

{y:"content",m:"m5",t:"How Lawyers Use Claude",b:["First-pass contract review and clause comparison against a standard template","Summarizing case law or lengthy filings","Drafting routine correspondence and internal memos","Final legal judgment, filing, and client advice always remain with a licensed attorney"],n:"—",v:"—",e:"'Compare this NDA against our standard template and list every clause that differs.'",q:"—"},

{y:"content",m:"m5",t:"How Engineers and Architects Use Claude",b:["Drafting and explaining technical documentation","Reviewing code for readability, bugs, and style — not a replacement for testing","Summarizing technical specifications for non-technical stakeholders","Brainstorming design alternatives against stated constraints"],n:"—",v:"—",e:"'Review this function for possible edge-case bugs and explain each one in plain language.'",q:"—"},

{y:"content",m:"m5",t:"How Executives, Managers, and Consultants Use Claude",b:["Preparing board materials, strategic memos, and executive summaries","Structuring and facilitating decision-making frameworks (SWOT, RACI, decision matrices)","Drafting first-pass client deliverables that a consultant then refines","Getting a fast 'red team' critique of a plan before presenting it"],n:"—",v:"—",e:"'Play devil's advocate: what are the three strongest objections to this strategy?'",q:"—"},

{y:"content",m:"m5",t:"Workshop Instructions: Choosing Your Exercises",b:["Open the Hands-On Workshop tab and pick the domain closest to your role","Complete at least five exercises directly, live, in your own Claude account","Work in pairs where helpful — talk through your prompts before running them","Flag anything surprising (good or bad) to discuss as a group afterward"],n:"This is unstructured working time — circulate the room and help participants who get stuck.",v:"—",e:"—",q:"—"},

{y:"content",m:"m5",t:"Capstone Project Briefing",b:["Choose one real task from your job that Claude can genuinely help with","Use this course's frameworks: structured prompting, iteration, and (where useful) a Project","Produce one finished artifact: a report, plan, campaign, lesson, or analysis","Prepare a two-minute presentation: the task, your approach, and what Claude got right or wrong"],n:"Give participants time now to start drafting — most of the value comes from doing it live with support available.",v:"Capstone brief handout.",e:"—",q:"What real task will you bring to your capstone project?"},

{y:"section",m:"m6",t:"Module 6 — Responsible AI, Assessment & Certification",n:"1 hour. Goal: reinforce responsible use, complete the assessment, present capstones, and certify.",},

{y:"content",m:"m6",t:"Responsible AI in Daily Practice",b:["Always disclose AI assistance where your organization or context requires it","Keep a human reviewer in the loop for anything consequential","Watch for over-reliance — skills atrophy if you stop checking AI output critically","Revisit your organization's AI policy periodically as tools and rules evolve"],n:"—",v:"—",e:"—",q:"—"},

{y:"content",m:"m6",t:"AI Governance for Your Organization",b:["A short written policy beats no policy — start simple and iterate","Define approved tools, approved data types, and required review steps","Assign clear ownership for keeping the policy current","Train new hires on the policy as part of onboarding, not as an afterthought"],n:"If time allows, have participants sketch a one-page draft policy for their own organization.",v:"—",e:"—",q:"—"},

{y:"content",m:"m6",t:"The Future of AI at Work — What to Watch",b:["AI literacy becoming a baseline expectation across roles, not a specialist skill","Growing use of AI agents that complete multi-step tasks with less supervision","Increasing regulation and disclosure requirements across sectors","The durable advantage: people who can direct AI clearly and verify its output well"],n:"Close on the same empowering note as the end of Module 1 — bookend the day.",v:"—",e:"—",q:"—"},

{y:"content",m:"m6",t:"Assessment Instructions",b:["40 multiple-choice questions covering all six modules","70% (28/40) or higher required to pass","Immediate feedback and explanations after each answer","Retakes are available — the goal is learning, not gatekeeping"],n:"Move the group to the Assessment tab now.",v:"—",e:"—",q:"—"},

{y:"content",m:"m6",t:"Capstone Presentation Guidelines",b:["Two minutes per participant: the task, your approach, the result","Name one thing Claude did well and one thing it got wrong or needed correction","Peers and instructor give brief, constructive feedback","Completed capstone + passed assessment = certificate issued"],n:"—",v:"—",e:"—",q:"—"},

var deckIdx = 0;

function slideKicker(s){ return s.m ? MOD_LABEL[s.m] : ""; }

function slideHTML(s, i){
  var accentColor = s.m ? "var("+s.m+")" : "var(--accent)";
  var typeClass = s.y === "title" ? " d-title" : (s.y === "section" ? " d-section" : "");
  var html = '<div class="dslide'+typeClass+'" data-i="'+i+'">';
  if (s.y === "title"){
    html += '<div class="d-t-eyebrow">Cedars Abroad Executive Certificate</div>';
    html += '<div class="d-t-title">'+s.t+'</div>';
    html += '<div class="d-t-subtitle">'+(s.sub||"")+'</div>';
    html += '<div class="d-t-footer">'+(s.foot||"")+'</div>';
  } else if (s.y === "section"){
    html += '<div class="d-sec-eyebrow">'+slideKicker(s)+'</div>';
    html += '<div class="d-sec-title">'+s.t+'</div>';
  } else {
    html += '<div class="d-accent" style="background:'+accentColor+'"></div>';
    if (s.m) html += '<div class="d-kicker" style="color:'+accentColor+'">'+slideKicker(s)+'</div>';
    html += '<div class="d-heading'+(s.m?'':' no-kicker')+'">'+s.t+'</div>';
    html += '<ul class="d-bullets">'+(s.b||[]).map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
    html += '<div class="d-footleft">Introduction to AI Using Claude</div>';
    html += '<div class="d-pageno">'+(i+1)+' / '+SLIDES.length+'</div>';
  }
  html += '</div>';
  return html;
}

function renderSlides(){
  var html = '<p class="eyebrow">Live Instructor Deck</p>';
  html += '<h1 class="page-title">Full Slide Deck</h1>';
  html += '<p class="page-sub">'+SLIDES.length+' slides covering every module — built to present directly from this page. Use the arrows or keyboard to navigate, jump to any slide by number, and toggle speaker notes for delivery guidance, suggested visuals, live examples, and discussion questions.</p>';

  html += '<div class="deck-shell">';
  html += '<div class="deck-viewport" id="deckViewport"><div class="deck-stage" id="deckStage">';
  SLIDES.forEach(function(s,i){ html += slideHTML(s,i); });
  html += '</div></div>';
  html += '<div class="deck-controls">';
  html += '<button class="btn small" id="deckFirst">⏮ First</button>';
  html += '<button class="btn small" id="deckPrev">← Prev</button>';
  html += '<span class="deck-count" id="deckCount"></span>';
  html += '<button class="btn small" id="deckNext">Next →</button>';
  html += '<button class="btn small" id="deckLast">Last ⏭</button>';
  html += '<span class="deck-sep"></span>';
  html += '<input class="deck-jump" id="deckJump" type="number" min="1" max="'+SLIDES.length+'" value="1">';
  html += '<button class="btn small" id="deckGo">Go</button>';
  html += '<span class="deck-sep"></span>';
  html += '<button class="btn small" id="deckFull">⤢ Fullscreen</button>';
  html += '<button class="btn small" id="deckNotesBtn">📝 Speaker Notes</button>';
  html += '</div>';
  html += '</div>';

  html += '<div class="notes-toggle-wrap"><div class="notes-panel" id="notesPanel"></div></div>';

  html += '<h2 class="sub-title" style="margin-top:32px;">Jump to a Module</h2>';
  html += '<div class="deck-toc" id="deckToc"></div>';

  document.getElementById("panel-slides").innerHTML = html;
  wireDeck();
}

function wireDeck(){
  var stage = document.getElementById("deckStage");
  var viewport = document.getElementById("deckViewport");
  var slides = stage.querySelectorAll(".dslide");

  function fitStage(){
    var scale = viewport.clientWidth / 1280;
    stage.style.transform = "scale("+scale+")";
  }
  fitStage();
  window.addEventListener("resize", fitStage);

  function show(i){
    if (i < 0) i = 0;
    if (i >= SLIDES.length) i = SLIDES.length - 1;
    deckIdx = i;
    slides.forEach(function(sl,idx){ sl.classList.toggle("active", idx===i); });
    document.getElementById("deckCount").textContent = (i+1)+" / "+SLIDES.length;
    document.getElementById("deckJump").value = i+1;
    updateNotes(i);
    updateToc(i);
  }

  function updateNotes(i){
    var s = SLIDES[i];
    var panel = document.getElementById("notesPanel");
    var html = '';
    html += '<div class="nrow"><b>Speaker notes:</b> '+(s.n||"—")+'</div>';
    if (s.v) html += '<div class="nrow"><b>Suggested visual:</b> '+s.v+'</div>';
    if (s.e) html += '<div class="nrow"><b>Live example:</b> '+s.e+'</div>';
    if (s.q) html += '<div class="nrow"><b>Ask the room:</b> '+s.q+'</div>';
    panel.innerHTML = html;
  }

  var tocBuilt = false;
  function updateToc(i){
    if (tocBuilt) {
      document.querySelectorAll("#deckToc button").forEach(function(b){
        b.classList.toggle("cur", parseInt(b.getAttribute("data-i"),10) <= i && (i < SLIDES.length));
      });
      return;
    }
  }

  var toc = document.getElementById("deckToc");
  var tocHtml = "";
  SLIDES.forEach(function(s,i){
    if (s.y === "section" || s.y === "title"){
      tocHtml += '<button data-i="'+i+'">'+(i+1)+'. '+s.t+'</button>';
    }
  });
  toc.innerHTML = tocHtml;
  toc.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){ show(parseInt(b.getAttribute("data-i"),10)); });
  });

  document.getElementById("deckFirst").addEventListener("click", function(){ show(0); });
  document.getElementById("deckPrev").addEventListener("click", function(){ show(deckIdx-1); });
  document.getElementById("deckNext").addEventListener("click", function(){ show(deckIdx+1); });
  document.getElementById("deckLast").addEventListener("click", function(){ show(SLIDES.length-1); });
  document.getElementById("deckGo").addEventListener("click", function(){
    var v = parseInt(document.getElementById("deckJump").value,10);
    if (!isNaN(v)) show(v-1);
  });
  document.getElementById("deckFull").addEventListener("click", function(){
    if (viewport.requestFullscreen) viewport.requestFullscreen();
    setTimeout(fitStage, 60);
  });
  document.getElementById("deckNotesBtn").addEventListener("click", function(){
    document.getElementById("notesPanel").classList.toggle("show");
  });
  document.addEventListener("keydown", function(e){
    var panel = document.getElementById("panel-slides");
    if (!panel || !panel.classList.contains("active")) return;
    if (e.key === "ArrowRight") show(deckIdx+1);
    if (e.key === "ArrowLeft") show(deckIdx-1);
  });

  show(0);
}

renderers.slides = renderSlides;
document.getElementById("cnt-slides").textContent = SLIDES.length;

var promptFilter = "all";
var promptSearch = "";

function renderPrompts(){
  var html = '<p class="eyebrow">Ready-to-Use Prompt Library</p>';
  html += '<h1 class="page-title">'+PROMPTS.length+' Professional Prompts</h1>';
  html += '<p class="page-sub">Every prompt includes its purpose, the exact prompt text, the expected output, and a tip for improving it further. Filter by category or search, then copy any prompt straight into Claude.</p>';
  html += '<input class="search-box" id="promptSearch" type="text" placeholder="Search prompts by purpose or keyword...">';
  html += '<div class="filter-row" id="promptFilters"></div>';
  html += '<div class="prompt-grid" id="promptGrid"></div>';
  document.getElementById("panel-prompts").innerHTML = html;

  var filterRow = document.getElementById("promptFilters");
  var chips = '<button class="filter-chip active" data-cat="all">All ('+PROMPTS.length+')</button>';
  PROMPT_CATS.forEach(function(c){
    var n = PROMPTS.filter(function(p){return p.cat===c.key;}).length;
    chips += '<button class="filter-chip" data-cat="'+c.key+'">'+c.label+' ('+n+')</button>';
  });
  filterRow.innerHTML = chips;
  filterRow.querySelectorAll(".filter-chip").forEach(function(b){
    b.addEventListener("click", function(){
      promptFilter = b.getAttribute("data-cat");
      filterRow.querySelectorAll(".filter-chip").forEach(function(x){ x.classList.toggle("active", x===b); });
      drawPromptGrid();
    });
  });
  document.getElementById("promptSearch").addEventListener("input", function(e){
    promptSearch = e.target.value.toLowerCase();
    drawPromptGrid();
  });
  drawPromptGrid();
}

function catLabel(key){ var c = PROMPT_CATS.filter(function(x){return x.key===key;})[0]; return c ? c.label : key; }

function drawPromptGrid(){
  var grid = document.getElementById("promptGrid");
  var list = PROMPTS.filter(function(p){
    if (promptFilter !== "all" && p.cat !== promptFilter) return false;
    if (promptSearch && (p.purpose+" "+p.prompt).toLowerCase().indexOf(promptSearch) === -1) return false;
    return true;
  });
  if (!list.length){ grid.innerHTML = '<p style="font-size:13px;color:var(--ink-muted);">No prompts match that search.</p>'; return; }
  var html = "";
  list.forEach(function(p,idx){
    html += '<div class="prompt-card">';
    html += '<div class="prompt-cat">'+catLabel(p.cat)+'</div>';
    html += '<div class="prompt-purpose">'+p.purpose+'<button class="copy-btn" data-idx="'+PROMPTS.indexOf(p)+'">Copy</button></div>';
    html += '<div class="prompt-text">'+p.prompt+'</div>';
    html += '<div class="prompt-meta"><b>Expected output:</b> '+p.output+'</div>';
    html += '<div class="prompt-tip"><b>Tip:</b> '+p.tip+'</div>';
    html += '</div>';
  });
  grid.innerHTML = html;
  grid.querySelectorAll(".copy-btn").forEach(function(b){
    b.addEventListener("click", function(){
      var idx = parseInt(b.getAttribute("data-idx"),10);
      var text = PROMPTS[idx].prompt;
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ b.textContent = "Copied!"; setTimeout(function(){ b.textContent="Copy"; },1400); });
      }
    });
  });
}

renderers.prompts = renderPrompts;
document.getElementById("cnt-prompts").textContent = PROMPTS.length;

var quizAnswers = {};

function renderAssessment(){
  var html = '<p class="eyebrow">Certification</p>';
  html += '<h1 class="page-title">Final Assessment & Capstone</h1>';
  html += '<p class="page-sub">A 40-question knowledge check (70% / 28 correct required to pass), a capstone project brief, and the grading rubric used to certify participants.</p>';

  html += '<div class="quiz-shell">';
  html += '<div class="quiz-score" id="quizScore"><div class="qs-num" id="qsNum">0 / '+QUIZ.length+'</div><div class="qs-lbl" id="qsLbl">Answer questions below — your score updates live. 28/40 (70%) is a pass.</div></div>';
  html += '<div class="quiz-progress" id="quizProgress"></div>';
  html += '<div id="quizList"></div>';
  html += '</div>';

  html += '<h2 class="sub-title" style="margin-top:36px;">Capstone Project Brief</h2>';
  html += '<div class="card" style="margin-bottom:20px;"><p>Choose one real, recurring task from your own job that Claude can genuinely help with. Using the frameworks from this course — structured prompting (Role, Context, Task, Format), iterative refinement, and a Claude Project where useful — produce one finished artifact: a report, plan, campaign, lesson, analysis, or equivalent deliverable in your field.</p>';
  html += '<p style="margin-top:10px;">Prepare a two-minute presentation covering: (1) the task you chose and why it matters, (2) your approach and the prompts you used, (3) the finished result, and (4) one thing Claude got right and one thing it got wrong or needed correction. Presentations happen in Module 6, and a completed, presented capstone is required for certification.</p></div>';

  html += '<h2 class="sub-title">Grading Rubric</h2>';
  html += '<div style="overflow-x:auto;"><table class="rubric-table"><thead><tr><th>Criterion</th><th>Excellent (4)</th><th>Good (3)</th><th>Developing (2)</th><th>Needs Work (1)</th></tr></thead><tbody>';
  html += rubricRow("Task relevance","Directly tied to a real, recurring work task with clear value","Relevant task, value is plausible","Task is somewhat generic or hypothetical","Task is unclear or trivial");
  html += rubricRow("Prompt quality","Prompts show role, context, task, and format applied deliberately, with visible iteration","Prompts are clear and mostly well-structured","Prompts are usable but under-specified","Prompts are vague or copy-pasted without adaptation");
  html += rubricRow("Output quality","Finished artifact is genuinely usable with minimal further editing","Finished artifact is solid, needs light editing","Artifact is a rough draft only","Artifact is incomplete or unusable");
  html += rubricRow("Critical evaluation","Specific, credible account of what Claude got right and wrong, with verification shown","Reasonable account of strengths and limitations","Limited or vague reflection","No critical evaluation offered");
  html += rubricRow("Presentation","Clear, concise, two minutes, confidently answers questions","Clear and within time","Runs long or lacks clarity","Unprepared or missing");
  html += '</tbody></table></div>';

  document.getElementById("panel-assessment").innerHTML = html;
  drawQuiz();
}

function rubricRow(name,e,g,d,n){
  return '<tr><td><b>'+name+'</b></td><td>'+e+'</td><td>'+g+'</td><td>'+d+'</td><td>'+n+'</td></tr>';
}

function drawQuiz(){
  var list = document.getElementById("quizList");
  var html = "";
  QUIZ.forEach(function(item,i){
    html += '<div class="quiz-q" data-i="'+i+'">';
    html += '  <div class="qn">Question '+(i+1)+' of '+QUIZ.length+'</div>';
    html += '  <div class="qtext">'+item.q+'</div>';
    item.opts.forEach(function(o,oi){
      html += '  <div class="quiz-opt" data-oi="'+oi+'">'+o+'</div>';
    });
    html += '  <div class="quiz-explain" id="exp-'+i+'"><b>Explanation:</b> '+item.exp+'</div>';
    html += '</div>';
  });
  list.innerHTML = html;

  list.querySelectorAll(".quiz-q").forEach(function(qEl){
    var qi = parseInt(qEl.getAttribute("data-i"),10);
    qEl.querySelectorAll(".quiz-opt").forEach(function(optEl){
      optEl.addEventListener("click", function(){
        if (quizAnswers.hasOwnProperty(qi)) return; // already answered
        var oi = parseInt(optEl.getAttribute("data-oi"),10);
        quizAnswers[qi] = oi;
        qEl.querySelectorAll(".quiz-opt").forEach(function(x,xi){
          var cls = xi===QUIZ[qi].c ? "correct" : (xi===oi ? "incorrect" : "");
          if (cls) x.classList.add(cls);
          if (xi===oi) x.classList.add("selected");
        });
        document.getElementById("exp-"+qi).classList.add("show");
        updateScore();
      });
    });
  });
  updateScore();
}

function updateScore(){
  var answered = Object.keys(quizAnswers).length;
  var correct = 0;
  Object.keys(quizAnswers).forEach(function(k){ if (quizAnswers[k] === QUIZ[k].c) correct++; });
  document.getElementById("qsNum").textContent = correct+" / "+QUIZ.length;
  var progress = document.getElementById("quizProgress");
  if (answered === 0){
    document.getElementById("qsLbl").textContent = "Answer questions below — your score updates live. 28/40 (70%) is a pass.";
    progress.textContent = "";
  } else if (answered < QUIZ.length){
    document.getElementById("qsLbl").textContent = correct+" correct so far, out of "+answered+" answered.";
    progress.textContent = answered+" of "+QUIZ.length+" questions answered.";
  } else {
    var pass = correct/QUIZ.length >= 0.7;
    document.getElementById("qsLbl").textContent = pass ? "Passed — "+correct+"/"+QUIZ.length+" (70% or higher). Certificate-eligible pending capstone." : "Not yet passing — "+correct+"/"+QUIZ.length+". Review the modules above and retake.";
    progress.textContent = "All "+QUIZ.length+" questions answered.";
  }
}

renderers.assessment = renderAssessment;

window.__cert = { selectTab: selectTab, renderers: renderers, rendered: rendered };

})();
</script>
